name: Build APK

on:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --verbose 2>&1 | tail -50

      - name: List build outputs
        run: find build -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: List all build dir
        run: ls -laR build/app/outputs/ 2>/dev/null || echo "No outputs dir"

      - name: Upload any APK found
        uses: actions/upload-artifact@v4
        with:
          name: adentweet-apk
          path: build/**/*.apk
          if-no-files-found: warn
          retention-days: 7