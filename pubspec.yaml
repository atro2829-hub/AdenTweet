name: adentweet
description: AdenTweet - Social Media App
version: 2.0.0+2
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  timeago: ^3.7.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  intl: ^0.19.0
  uuid: ^4.5.1
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/